[project]
name = "veyl"
version = "0.9.0"
requires-python = ">=3.9"
dependencies = [
    "autocorrect",
    "tqdm"
]

[tool.setuptools]
py-modules = [
    "veyl",
    "error",
    "built_in_libraries",
    "resolve_external",
    "syntax_encloser",
    "errormd"
]

[tool.setuptools.packages.find]
include = ["VeylCLI*"]

[tool.setuptools.package-data]
errormd = ["*.json"]

[project.scripts]
veyl = "VeylCLI.veylcli:main"